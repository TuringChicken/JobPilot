# Real-LLM smoke tests (backend/tests/test_live.py). Manual only: costs money and is not
# deterministic, so it never gates pushes or PRs. Credentials come from the `live-llm`
# environment (Settings > Environments); see docs/BACKEND.md section 11.
name: Live LLM smoke tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: LLM provider to test
        type: choice
        options: [dashscope, azure]
        default: dashscope

concurrency:
  group: live-llm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  live:
    name: pytest -m live (${{ inputs.provider }})
    runs-on: ubuntu-latest
    environment: live-llm
    timeout-minutes: 20
    env:
      LLM_PROVIDER: ${{ inputs.provider }}
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
      # Non-secret config; unset variables are empty and fall back to Settings defaults.
      DASHSCOPE_BASE_URL: ${{ vars.DASHSCOPE_BASE_URL }}
      DASHSCOPE_MODEL: ${{ vars.DASHSCOPE_MODEL }}
      AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_CHAT_DEPLOYMENT: ${{ vars.AZURE_OPENAI_CHAT_DEPLOYMENT }}
      LLM_REASONING_EFFORT: ${{ vars.LLM_REASONING_EFFORT }}
      LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS }}
    steps:
      # Without credentials test_live.py skips everything and the run would look green.
      - name: Check credentials
        run: |
          if [ "$LLM_PROVIDER" = dashscope ] && [ -z "$DASHSCOPE_API_KEY" ]; then
            echo "::error::DASHSCOPE_API_KEY is not set in the live-llm environment"; exit 1
          fi
          if [ "$LLM_PROVIDER" = azure ]; then
            for name in AZURE_OPENAI_API_KEY AZURE_OPENAI_ENDPOINT AZURE_OPENAI_CHAT_DEPLOYMENT; do
              if [ -z "${!name}" ]; then
                echo "::error::$name is not set in the live-llm environment"; exit 1
              fi
            done
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Live tests
        run: pytest -m live -s -v
