[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
# Live smoke tests call the real LLM; run them explicitly with `pytest -m live -s`.
addopts = "-m 'not live'"
markers = ["live: calls the real LLM provider from .env (skipped by default)"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["backend"]
extend-exclude = ["backend/alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# backend/alembic (migration scripts) would otherwise shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Security"]
